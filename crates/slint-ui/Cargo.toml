[package]
name = "itrtg-slint"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-2", "unstable-winit-030"] }
itrtg-models = { path = "../models" }
itrtg-planner = { path = "../planner" }
pet-importer = { path = "../pet-importer", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
save-parser = { path = "../save-parser" }
rfd = "0.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webbrowser = "1.2"
arboard = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Event", "EventTarget", "DragEvent", "DataTransfer", "FileList", "File", "Blob", "Navigator", "Clipboard"] }

[build-dependencies]
slint-build = "=1.17.1"
