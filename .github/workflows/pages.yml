name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      # The Slint front end (crates/slint-ui) links fontconfig on Linux, which
      # the runner image does not ship the headers for.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages

      - name: Test workspace
        run: cargo test --workspace

      - name: Build WASM
        run: trunk build --release --public-url /itrtg_pet_analyzer_dungeon_planner/
        working-directory: crates/gui

      # The Slint port is published beside the egui app, under /slint/, so it
      # can be tried in the browser while egui stays the default. Same origin,
      # so it can read the egui app's saved settings on its first run. A failure
      # here must not block the main deployment.
      - name: Build Slint WASM (preview at /slint/)
        continue-on-error: true
        run: trunk build --release --public-url /itrtg_pet_analyzer_dungeon_planner/slint/ --dist ../gui/dist/slint
        working-directory: crates/slint-ui

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/gui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
